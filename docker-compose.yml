services:
  db:
    image: postgres:16-alpine
    container_name: bookmydrone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: drone
      POSTGRES_PASSWORD: drone
      POSTGRES_DB: bookmydrone
    ports:
      # Host port 5433 to avoid clashing with any other Postgres already on 5432.
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drone -d bookmydrone"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dbdata:
